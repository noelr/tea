<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought Capture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .input-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .input-section textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }

    .input-section textarea:focus {
      outline: none;
      border-color: #007bff;
    }

    .input-section button {
      margin-top: 15px;
      padding: 12px 30px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-section button:hover {
      background: #0056b3;
    }

    .input-section button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .time-group {
      margin-bottom: 25px;
    }

    .time-group h2 {
      color: #555;
      font-size: 18px;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e0e0e0;
    }

    .thought-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .thought-content {
      font-size: 16px;
      color: #333;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .thought-time {
      font-size: 12px;
      color: #999;
      margin-bottom: 15px;
    }

    .classifications {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .classification-group {
      flex: 1;
      min-width: 150px;
    }

    .classification-group h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .classification-group.events h4 { color: #9c27b0; }
    .classification-group.actions h4 { color: #f57c00; }

    .classification-item {
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 5px;
    }

    .classification-group.events .classification-item {
      background: #f3e5f5;
      color: #7b1fa2;
    }

    .classification-group.actions .classification-item {
      background: #fff3e0;
      color: #e65100;
    }

    .tags-section {
      margin-bottom: 15px;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .tag:hover {
      background: #c8e6c9;
    }

    .filter-bar {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: none;
    }

    .filter-bar.active {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-bar .filter-tag {
      background: #2e7d32;
      color: white;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 14px;
    }

    .filter-bar .clear-filter {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 18px;
      padding: 0 5px;
    }

    .filter-bar .clear-filter:hover {
      color: #333;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thought Capture</h1>

    <div class="input-section">
      <textarea id="thoughtInput" placeholder="Enter your thought... (e.g., 'Brigitte called, we need to create a new export for EDAVis')"></textarea>
      <button id="captureBtn" onclick="captureThought()">Capture Thought</button>
    </div>

    <div id="filterBar" class="filter-bar">
      <span>Filtering by:</span>
      <span id="filterTagName" class="filter-tag"></span>
      <button class="clear-filter" onclick="clearFilter()">&times;</button>
    </div>

    <div id="thoughtsContainer">
      <div class="loading"><span class="spinner"></span>Loading thoughts...</div>
    </div>
  </div>

  <script>
    const API_URL = '/api/thoughts';
    let currentFilter = null;

    async function loadThoughts() {
      try {
        const response = await fetch(API_URL);
        const grouped = await response.json();
        renderThoughts(grouped);
      } catch (error) {
        console.error('Failed to load thoughts:', error);
        document.getElementById('thoughtsContainer').innerHTML =
          '<div class="empty-state">Failed to load thoughts</div>';
      }
    }

    async function filterByTag(tagName) {
      currentFilter = tagName;
      document.getElementById('filterBar').classList.add('active');
      document.getElementById('filterTagName').textContent = tagName;

      try {
        const response = await fetch(`/api/tags/${encodeURIComponent(tagName)}`);
        const thoughts = await response.json();
        renderFilteredThoughts(thoughts, tagName);
      } catch (error) {
        console.error('Failed to filter by tag:', error);
      }
    }

    function clearFilter() {
      currentFilter = null;
      document.getElementById('filterBar').classList.remove('active');
      loadThoughts();
    }

    function renderFilteredThoughts(thoughts, tagName) {
      const container = document.getElementById('thoughtsContainer');

      if (thoughts.length === 0) {
        container.innerHTML = `<div class="empty-state">No thoughts found with tag "${tagName}"</div>`;
        return;
      }

      container.innerHTML = `
        <div class="time-group">
          <h2>Thoughts tagged "${tagName}"</h2>
          ${thoughts.map(renderThoughtCard).join('')}
        </div>
      `;
    }

    function renderThoughts(grouped) {
      const container = document.getElementById('thoughtsContainer');

      const periods = [
        { key: 'today', label: 'Today' },
        { key: 'yesterday', label: 'Yesterday' },
        { key: 'thisWeek', label: 'This Week' },
        { key: 'thisMonth', label: 'This Month' },
        { key: 'older', label: 'Older' }
      ];

      let html = '';
      let hasAnyThoughts = false;

      for (const period of periods) {
        const thoughts = grouped[period.key];
        if (thoughts && thoughts.length > 0) {
          hasAnyThoughts = true;
          html += `<div class="time-group">
            <h2>${period.label}</h2>
            ${thoughts.map(renderThoughtCard).join('')}
          </div>`;
        }
      }

      if (!hasAnyThoughts) {
        html = '<div class="empty-state">No thoughts captured yet. Start by entering a thought above!</div>';
      }

      container.innerHTML = html;
    }

    function renderThoughtCard(thought) {
      const events = thought.classifications.filter(c => c.type === 'event');
      const actions = thought.classifications.filter(c => c.type === 'action');
      const tags = thought.tags || [];

      const time = new Date(thought.created_at + 'Z').toLocaleString();

      return `
        <div class="thought-card">
          <div class="thought-content">${escapeHtml(thought.content)}</div>
          <div class="thought-time">${time}</div>
          ${tags.length > 0 ? `
            <div class="tags-section">
              <div class="tags-container">
                ${tags.map(t => `<span class="tag" onclick="filterByTag('${escapeHtml(t.name)}')">${escapeHtml(t.name)}</span>`).join('')}
              </div>
            </div>
          ` : ''}
          <div class="classifications">
            ${events.length > 0 ? `
              <div class="classification-group events">
                <h4>📅 Events</h4>
                ${events.map(e => `<div class="classification-item">${escapeHtml(e.description)}</div>`).join('')}
              </div>
            ` : ''}
            ${actions.length > 0 ? `
              <div class="classification-group actions">
                <h4>✅ Actions</h4>
                ${actions.map(a => `<div class="classification-item">${escapeHtml(a.description)}</div>`).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function captureThought() {
      const input = document.getElementById('thoughtInput');
      const btn = document.getElementById('captureBtn');
      const content = input.value.trim();

      if (!content) {
        alert('Please enter a thought');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Analyzing...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to capture thought');
        }

        input.value = '';
        await loadThoughts();
      } catch (error) {
        console.error('Failed to capture thought:', error);
        alert(error.message || 'Failed to capture thought. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Capture Thought';
      }
    }

    // Allow Ctrl+Enter to submit
    document.getElementById('thoughtInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        captureThought();
      }
    });

    // Load thoughts on page load
    loadThoughts();
  </script>
</body>
</html>
